<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171216">
  <meta name="description" content="สวัสดีคับ!! ลูกเรือที่เฮียก็ไม่ได้เคารพรักอะไรมากมาย ทุกทางเข้า ข้ารวมมาให้พวกเจ้าหมดแล้วที่นี่!">
  <title>0roroger | ช่องทางของลูกเรือ</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --paper: #fffaf7;
      --muted: #c8b8b4;
      --red: #ee514e;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--paper);
      background: #171216 url("assets/pirate-streamer-background.webp") center / cover fixed no-repeat;
    }

    body::before {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(21, 14, 17, .88) 0%, rgba(25, 15, 17, .76) 35%, rgba(20, 13, 15, .22) 78%),
        linear-gradient(0deg, rgba(24, 13, 17, .48), transparent 52%);
      content: "";
      pointer-events: none;
    }

    .page {
      position: relative;
      display: grid;
      grid-template-columns: minmax(300px, .85fr) minmax(460px, 1.15fr);
      align-items: center;
      gap: clamp(36px, 7vw, 104px);
      width: min(100% - 80px, 1220px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 56px 0;
    }

    .profile { max-width: 450px; }

    .avatar {
      display: block;
      width: clamp(120px, 13vw, 164px);
      height: clamp(120px, 13vw, 164px);
      margin: 20px 0 13px;
      border: 3px solid rgba(255,255,255,.86);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 12px 32px rgba(0,0,0,.42), 0 0 0 7px rgba(201,54,56,.22);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      color: #ffd0ca;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .eyebrow::before {
      width: 26px;
      height: 2px;
      background: var(--red);
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -.055em;
      line-height: 1.05;
      text-shadow: 0 3px 24px rgba(0,0,0,.45);
      white-space: nowrap;
    }

    .handle {
      margin: 10px 0 0;
      color: rgba(255,255,255,.78);
      font-size: .96rem;
      letter-spacing: .035em;
    }

    .bio {
      margin: 20px 0;
      color: rgba(255,255,255,.91);
      font-size: 1rem;
      line-height: 1.7;
      text-shadow: 0 2px 14px rgba(0,0,0,.4);
    }

    .links-panel {
      padding: 20px;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 16px;
      background: rgba(26, 17, 20, .68);
      box-shadow: 0 18px 60px rgba(0,0,0,.22);
      backdrop-filter: blur(12px);
    }

    .links-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 14px;
    }

    .links-heading h2 {
      margin: 0;
      font-size: .96rem;
      font-weight: 700;
    }

    .links-heading span { color: var(--muted); font-size: .75rem; }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .link {
      display: flex;
      min-width: 0;
      min-height: 82px;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 11px;
      color: var(--paper);
      background: rgba(255,255,255,.055);
      text-decoration: none;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 155, 148, .58);
      background: rgba(174, 43, 46, .32);
    }

    .link:focus-visible {
      outline: 2px solid #ffc0b8;
      outline-offset: 3px;
    }

    .link-icon {
      display: grid;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 9px;
      color: #ffe5df;
      background: rgba(201, 54, 56, .24);
    }

    .link-icon svg { width: 25px; height: 25px; fill: currentColor; }

    .link-label {
      overflow: hidden;
      font-size: .92rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-arrow {
      margin-left: auto;
      color: rgba(255,255,255,.48);
      font-size: .95rem;
    }

    @media (max-width: 900px) {
      body {
        background-attachment: scroll;
        background-position: 65% center;
      }

      body::before {
        background:
          linear-gradient(180deg, rgba(15, 10, 12, .48) 0%, rgba(15, 10, 12, .38) 30%, rgba(15, 10, 12, .88) 68%, rgba(15, 10, 12, .97) 100%),
          linear-gradient(90deg, rgba(15, 10, 12, .2), transparent);
      }

      .page {
        grid-template-columns: 1fr;
        gap: 23px;
        width: min(100% - 32px, 500px);
        align-content: end;
        min-height: 100svh;
        padding: 145px 0 24px;
      }

      .profile { max-width: none; }
      .avatar { width: 108px; height: 108px; margin: 13px 0 10px; }
      .eyebrow { margin-bottom: 7px; font-size: .68rem; }
      h1 { font-size: clamp(1.7rem, 8.8vw, 3.3rem); }
      .handle { margin-top: 7px; font-size: .9rem; }
      .bio { margin: 14px 0; font-size: .94rem; line-height: 1.7; }
      .links-panel { padding: 17px 14px; border-radius: 15px; }
      .links-heading { margin-bottom: 13px; }
      .links { gap: 8px; }
      .link { min-height: 58px; gap: 9px; padding: 8px; }
      .link-icon { width: 34px; height: 34px; flex-basis: 34px; border-radius: 9px; }
      .link-icon svg { width: 19px; height: 19px; }
      .link-label { font-size: .82rem; }
      .link-arrow { display: none; }
    }

    @media (max-width: 360px) {
      .page { width: min(100% - 24px, 500px); }
      .links-panel { padding-right: 10px; padding-left: 10px; }
      .link { gap: 7px; padding: 7px; }
      .link-label { font-size: .77rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
